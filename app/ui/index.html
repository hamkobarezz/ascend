<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
<title>Ascend</title>
<style>
  /* hamkobarezz.com system: dark ground, off-white type, orange only for the one thing to do next */
  :root {
    --ink: #0d0d0f; --tile: #141417; --hover: #1a1a1e; --line: #2a2925; --mute: #8d897d; --paper: #efead8; --accent: #ff5a1f; --ok: #46c46a;
    --display: "Inter Tight", "Segoe UI Variable Display", "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif;
    --body: "Inter", "Segoe UI Variable Text", "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, monospace;
    --ease: cubic-bezier(.16, 1, .3, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--ink); color: var(--paper); font: 13px/1.45 var(--body); -webkit-font-smoothing: antialiased; user-select: none; display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .k { font: 10px/1.4 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
  svg.i { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- loading screen (the installer splash, build/installer-splash.bmp, is its last frame) */
  #splash { position: fixed; inset: 0; z-index: 50; background: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; transition: opacity .5s var(--ease), transform .6s var(--ease); }
  #splash.done { opacity: 0; transform: scale(1.03); pointer-events: none; }
  #splash .art { width: 124px; height: 90px; overflow: visible; }
  #splash .peaks { fill: var(--paper); fill-opacity: 0; stroke: var(--paper); stroke-width: 6; stroke-linejoin: round; stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 1s var(--ease) .1s forwards, fill .45s ease .8s forwards; }
  #splash .sun { fill: var(--accent); opacity: 0; transform: translateY(70px); transform-box: fill-box; animation: rise .9s var(--ease) .85s forwards; }
  #splash .word { font: 700 30px/1 var(--display); letter-spacing: -.05em; opacity: 0; transform: translateY(8px); animation: rise .6s var(--ease) .45s forwards; }
  #splash .track { width: 140px; height: 1px; background: var(--line); overflow: hidden; opacity: 0; animation: show .4s ease .6s forwards; }
  #splash .track i { display: block; width: 40%; height: 100%; background: var(--accent); animation: slide 1.1s ease-in-out infinite; }
  #splash .cap { min-height: 14px; opacity: 0; animation: show .4s ease .7s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes fill { to { fill-opacity: 1; stroke-width: 0; } }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @keyframes show { to { opacity: 1; } }
  @keyframes slide { from { transform: translateX(-110%); } to { transform: translateX(260%); } }

  /* ---------- title bar */
  .bar { -webkit-app-region: drag; display: flex; align-items: center; gap: 9px; height: 50px; padding: 0 6px 0 20px; flex: none; }
  .mark { width: 25px; height: 18px; flex: none; }
  .logo { font: 700 19px/1 var(--display); letter-spacing: -.05em; }
  .bar .sp { flex: 1; }
  .live { display: inline-flex; align-items: center; gap: 6px; margin-right: 8px; }
  .live i { width: 6px; height: 6px; border-radius: 50%; background: var(--mute); }
  .live.on i { background: var(--ok); }
  .live.off { color: var(--accent); }
  .live.off i { background: var(--accent); }
  .win { -webkit-app-region: no-drag; width: 32px; height: 32px; display: grid; place-items: center; border: 0; background: none; color: var(--mute); cursor: pointer; }
  .win:hover { color: var(--paper); }
  .win.close:hover { color: var(--accent); }

  main { flex: 1; overflow-y: auto; padding: 18px 22px 22px; display: flex; flex-direction: column; }
  main::-webkit-scrollbar { width: 4px; }
  main::-webkit-scrollbar-thumb { background: var(--line); }
  body.ready .in { animation: up .55s var(--ease) both; animation-delay: calc(var(--d, 0) * 70ms); }
  @keyframes up { from { opacity: 0; transform: translateY(8px); } }

  /* ---------- the one next step */
  .step { font: 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
  h1 { margin: 8px 0 8px; font: 800 34px/1 var(--display); letter-spacing: -.05em; }
  .lead { margin: 0; color: var(--mute); font-size: 13px; max-width: 28em; }
  .lead b { color: var(--paper); font-weight: 600; }
  .cta { display: flex; align-items: center; justify-content: space-between; width: 100%; height: 48px; margin-top: 20px; padding: 0 18px; border: 0; background: var(--accent); color: var(--ink); font: 700 15px var(--display); letter-spacing: -.01em; cursor: pointer; transition: background .2s; }
  .cta:hover:not(:disabled) { background: var(--paper); }
  .cta .arr { transition: transform .25s var(--ease); }
  .cta:hover:not(:disabled) .arr { transform: translateX(4px); }
  .cta:disabled { cursor: progress; background: var(--tile); color: var(--paper); }
  .cta:disabled .arr { visibility: hidden; }
  .cta[hidden] { display: none; }

  /* ---------- apps */
  .apps { margin-top: 26px; }
  .app { display: flex; align-items: center; gap: 12px; height: 56px; border-top: 1px solid var(--line); }
  .app:last-child { border-bottom: 1px solid var(--line); }
  .ico { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 8px; font: 700 13px var(--display); letter-spacing: -.02em; flex: none; }
  .ico.ae { background: #00005b; color: #9999ff; }
  .ico.ai { background: #330000; color: #ff9a00; }
  .ico.ps { background: #001e36; color: #31a8ff; }
  .ico.fg { background: #1e1e1e; color: #efead8; border: 1px solid #333; }
  .app .t { flex: 1; min-width: 0; }
  .app b { display: block; font: 600 14px/1.25 var(--display); }
  .app small { display: block; font-size: 11.5px; color: var(--mute); }
  .app.installed small { color: var(--ok); }
  .app .tick { width: 18px; height: 18px; color: var(--ok); }
  .app .go { height: 28px; padding: 0 12px; border: 1px solid var(--line); background: transparent; color: var(--paper); font: 600 12px var(--display); cursor: pointer; transition: border-color .2s, background .2s, color .2s; }
  .app .go:hover:not(:disabled) { border-color: var(--paper); }
  .app .go.hot { border-color: var(--accent); color: var(--accent); }
  .app .go.hot:hover:not(:disabled) { background: var(--accent); color: var(--ink); }
  .app .go:disabled { cursor: progress; color: var(--mute); }
  .missing { margin-top: 10px; }
  .skel .ico, .skel .s1, .skel .s2 { background: var(--tile); animation: pulse 1.2s ease-in-out infinite; }
  .skel .s1 { width: 110px; height: 11px; }
  .skel .s2 { width: 70px; height: 8px; margin-top: 6px; }
  @keyframes pulse { 50% { opacity: .45; } }
  .dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }

  .last { margin-top: auto; padding-top: 18px; font-size: 11.5px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .last em { font-style: normal; color: var(--paper); }
  .last.new em { animation: blink .9s steps(2) 2; }
  @keyframes blink { 50% { color: var(--accent); } }

  /* first run */
  .welcome { margin-bottom: 22px; padding: 14px; background: var(--tile); border-left: 2px solid var(--accent); }
  .welcome b { display: block; font: 700 15px var(--display); margin-bottom: 2px; }
  .welcome p { margin: 0 0 12px; font-size: 12px; color: var(--mute); }
  .welcome .btns { display: flex; gap: 8px; }
  .welcome button { flex: 1; height: 32px; border: 1px solid var(--line); background: transparent; font: 600 12px var(--display); cursor: pointer; }
  .welcome button.yes { background: var(--paper); color: var(--ink); border-color: var(--paper); }

  /* ---------- toast */
  .toast { position: fixed; left: 0; right: 0; bottom: 44px; z-index: 20; display: flex; gap: 12px; padding: 13px 22px; background: var(--paper); color: var(--ink); font-size: 12.5px; transform: translateY(110%); transition: transform .4s var(--ease); }
  .toast.show { transform: none; }
  .toast.err { background: var(--accent); }
  .toast span { flex: 1; }
  .toast button { border: 0; background: none; cursor: pointer; padding: 0; align-self: start; color: var(--ink); }

  /* ---------- footer */
  footer { flex: none; position: relative; z-index: 30; display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 22px; border-top: 1px solid var(--line); background: var(--ink); }
  .login { display: flex; align-items: center; gap: 9px; border: 0; background: none; padding: 0; cursor: pointer; }
  .switch { position: relative; width: 28px; height: 16px; border: 1px solid var(--mute); transition: background .2s, border-color .2s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 8px; height: 8px; background: var(--mute); transition: transform .25s var(--ease), background .2s; }
  .login.on .switch { background: var(--accent); border-color: var(--accent); }
  .login.on .switch::after { transform: translateX(12px); background: var(--ink); }
  footer a { color: var(--mute); text-decoration: none; cursor: pointer; }
  footer a:hover { color: var(--accent); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-min" viewBox="0 0 24 24"><path d="M6 12h12" /></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" /></symbol>
    <symbol id="i-tick" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M8 12.5l3 3 5-6" /></symbol>
  </defs>
</svg>

<div id="splash" role="status" aria-live="polite">
  <svg class="art" viewBox="0 0 368 268" aria-hidden="true">
    <path class="peaks" pathLength="100" d="M0 268 L132 80 L196 164 L264 52 L368 268 Z" />
    <circle class="sun" cx="56" cy="28" r="28" />
  </svg>
  <div class="word">ascend</div>
  <div class="track"><i></i></div>
  <div class="cap k" id="splashCap">Starting up</div>
</div>

<div class="bar">
  <svg class="mark" viewBox="0 0 368 268" aria-hidden="true"><path d="M0 268 L132 80 L196 164 L264 52 L368 268 Z" fill="#efead8" /><circle cx="56" cy="28" r="28" fill="#ff5a1f" /></svg>
  <div class="logo">ascend</div>
  <div class="sp"></div>
  <span class="live k" id="live" title=""><i></i><span id="liveText">Starting</span></span>
  <button class="win" id="min" title="Minimize" aria-label="Minimize"><svg class="i"><use href="#i-min" /></svg></button>
  <button class="win close" id="close" title="Close to tray" aria-label="Close to tray"><svg class="i"><use href="#i-x" /></svg></button>
</div>

<main>
  <div class="welcome in" id="welcome" style="--d:0" hidden>
    <b>Start Ascend when you log in?</b>
    <p>It stays in the tray so your plugins are always connected.</p>
    <div class="btns"><button class="yes" id="wYes">Yes</button><button id="wNo">Not now</button></div>
  </div>

  <div class="in" style="--d:1">
    <div class="step" id="step">Step 1 of 2</div>
    <h1 id="title">Install your plugins</h1>
    <p class="lead" id="lead">&nbsp;</p>
    <button class="cta" id="cta" hidden><span id="ctaText">Install</span><span class="arr">→</span></button>
  </div>

  <div class="apps in" id="apps" style="--d:2">
    <div class="app skel"><div class="ico"></div><div class="t"><div class="s1"></div><div class="s2"></div></div></div>
    <div class="app skel"><div class="ico"></div><div class="t"><div class="s1"></div><div class="s2"></div></div></div>
    <div class="app skel"><div class="ico"></div><div class="t"><div class="s1"></div><div class="s2"></div></div></div>
  </div>
  <div class="missing k in" id="missing" style="--d:3" hidden></div>

  <div class="last in" id="lastRow" style="--d:4"></div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toastText"></span>
  <button id="toastX" aria-label="Dismiss"><svg class="i"><use href="#i-x" /></svg></button>
</div>

<footer class="k">
  <button class="login k" id="login" role="switch" aria-checked="false"><span class="switch"></span>Open at login</button>
  <a id="quit">Quit</a>
</footer>

<script src="app.js"></script>
</body>
</html>
