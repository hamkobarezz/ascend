# Builds the Ascend installers: Ascend-Setup-x.y.z.exe (Windows) and Ascend-x.y.z.dmg (macOS,
# universal: Apple silicon + Intel). A .dmg can only be built on a Mac, so this runs on GitHub's runners.
# Run it from the Actions tab ("Run workflow") or by pushing a tag like v0.3.0; download the files
# from the run's "Artifacts" section.
#
# Plugin signing needs two repository secrets (Settings > Secrets and variables > Actions), so every
# build signs the After Effects / Illustrator panel with the same certificate as local builds:
#   ASCEND_CERT_P12       tools/zxpsign/ascend-cert.p12, base64-encoded
#   ASCEND_CERT_PASSWORD  its password
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: dist/*.exe
          # Intel Mac runners: Apple-silicon (macos-latest) runners often sit unassigned for lack of
          # capacity. The .dmg is still universal (Apple silicon + Intel).
          - os: macos-15-intel
            script: dist:mac
            files: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore the plugin signing certificate
        shell: bash
        env:
          CERT: ${{ secrets.ASCEND_CERT_P12 }}
        run: |
          if [ -z "$CERT" ]; then
            echo "::error::Add the ASCEND_CERT_P12 and ASCEND_CERT_PASSWORD secrets (see the top of this file)."
            exit 1
          fi
          echo "$CERT" | base64 --decode > tools/zxpsign/ascend-cert.p12

      # Adobe's macOS ZXPSignCmd is Intel-only; only needed if this ever runs on an Apple-silicon runner.
      - name: Install Rosetta (Apple-silicon macOS)
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        run: /usr/sbin/softwareupdate --install-rosetta --agree-to-license || true

      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          ASCEND_CERT_PASSWORD: ${{ secrets.ASCEND_CERT_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: false # unsigned app build; see README for app signing
      - uses: actions/upload-artifact@v4
        with:
          name: Ascend-${{ matrix.os }}
          path: ${{ matrix.files }}

  # A version tag (v0.3.0, ...) publishes the installers as a GitHub Release. It publishes whatever
  # built, so one stuck platform doesn't hold back the other; re-running that build adds its file.
  release:
    needs: build
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          cat > notes.md <<'NOTES'
          Send layers from **Illustrator, Photoshop and Figma** to **After Effects** as native, editable layers.

          ### Download
          - **Windows:** `Ascend-Setup-*.exe`
          - **macOS** (Apple silicon + Intel): `Ascend-*.dmg`

          ### Install
          1. Run the installer. Ascend opens and lives in the tray / menu bar.
          2. Click **Install plugins** in the app.
          3. Restart your Adobe apps, then open Ascend from **Window → Extensions → Ascend** (After Effects, Illustrator) or **Plugins → Ascend** (Photoshop). For Figma, click **Set up** and import the plugin once.

          The app isn't code-signed yet: on Windows choose **More info → Run anyway**, on macOS right-click the app and choose **Open** the first time.
          NOTES
          if [ -z "$(ls -A out 2>/dev/null)" ]; then
            echo "::error::No installers were built."
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "Ascend ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi
